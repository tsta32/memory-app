name: Review app template sync

on:
  workflow_dispatch:
  schedule:
    # Off the busy top of the hour; GitHub may delay scheduled runs.
    - cron: '17 * * * *'

permissions:
  contents: write
  pull-requests: write
  pages: write

# Covers manual and scheduled executions, including merge and deployment.
concurrency:
  group: app-template-sync-review
  cancel-in-progress: false

env:
  # Release gate: keep off until live canary/permissions/Pages checks are reviewed.
  # Do not replace this with an unreviewed repository variable or dispatch input.
  AUTOMERGE_ENABLED: 'false'

jobs:
  review:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Isolate candidate before applying any template changes
        run: git switch -c "sync/candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Read Worker and apply verified user fields locally
        id: prepare
        run: npm run sync:app-templates:review
        env:
          MEMORY_APP_SYNC_CODE: ${{ secrets.MEMORY_APP_SYNC_CODE }}
          MEMORY_APP_CONFIG_DIR: ${{ runner.temp }}/memory-app-sync-private
          MEMORY_APP_SYNC_RECEIPT: ${{ runner.temp }}/memory-app-sync-receipt.json
      - name: No changes
        if: steps.prepare.outputs.changed == 'false'
        run: echo 'No verified template differences; no new commit or PR. Only an already-merged automatic deployment may be checked or resumed when enabled.' >> "$GITHUB_STEP_SUMMARY"
      - name: Check or resume deployment of the last verified automatic merge
        if: steps.prepare.outputs.changed == 'false' && env.AUTOMERGE_ENABLED == 'true'
        run: |
          gh auth setup-git
          node scripts/sync-automation.cjs resume
        env:
          GH_TOKEN: ${{ github.token }}
          MEMORY_APP_SYNC_STATE: ${{ runner.temp }}/memory-app-sync-state.json
      - name: Install browser only for a changed candidate
        if: steps.prepare.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Test candidate using fixtures only
        if: steps.prepare.outputs.changed == 'true'
        run: npm test
        env:
          CI: 'true'
          MEMORY_APP_CONFIG_DIR: ${{ runner.temp }}/memory-app-test-config
      - name: Re-read Worker and reject edits made during testing
        if: steps.prepare.outputs.changed == 'true'
        run: node scripts/review-app-sync.cjs --verify
        env:
          MEMORY_APP_SYNC_CODE: ${{ secrets.MEMORY_APP_SYNC_CODE }}
          MEMORY_APP_SYNC_RECEIPT: ${{ runner.temp }}/memory-app-sync-receipt.json
      - name: Publish or reuse the identical tested PR
        id: publish
        if: steps.prepare.outputs.changed == 'true'
        run: |
          gh auth setup-git
          node scripts/sync-automation.cjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TESTS_PASSED: 'true'
          MEMORY_APP_SYNC_RECEIPT: ${{ runner.temp }}/memory-app-sync-receipt.json
          MEMORY_APP_SYNC_STATE: ${{ runner.temp }}/memory-app-sync-state.json
      - name: Keep automatic merging disabled during validation
        if: steps.prepare.outputs.changed == 'true' && env.AUTOMERGE_ENABLED != 'true'
        run: echo 'Candidate tested and submitted. Automatic main merge and Pages deployment are disabled by the release gate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Merge only the exact tested tree with unchanged main
        id: merge
        if: steps.publish.outputs.changed == 'true' && env.AUTOMERGE_ENABLED == 'true'
        run: node scripts/sync-automation.cjs merge
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TESTS_PASSED: 'true'
          MEMORY_APP_SYNC_STATE: ${{ runner.temp }}/memory-app-sync-state.json
      - name: Request and verify Pages build and public template contents
        if: steps.merge.outputs.merged == 'true'
        run: node scripts/sync-automation.cjs deploy
        env:
          GH_TOKEN: ${{ github.token }}
          MEMORY_APP_SYNC_STATE: ${{ runner.temp }}/memory-app-sync-state.json
      - name: Record failure for Actions notifications
        if: failure()
        run: |
          echo '::error title=App template sync failed::The failed stage is recorded in this run; review the run summary.'
          echo 'Sync failed. Check the failed stage above. Before merge, main is unchanged. A post-merge Pages failure is a separate deployment failure; no automatic history rewrite is attempted.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private runner files
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/memory-app-sync-private" "$RUNNER_TEMP/memory-app-test-config"
          rm -f -- "$RUNNER_TEMP/memory-app-sync-receipt.json" "$RUNNER_TEMP/memory-app-sync-state.json"
